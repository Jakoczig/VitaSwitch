name: Host fault-injection tests
on:
  push:
  pull_request:
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build the host I/O shim and VitaSwitch
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined \
            -fno-omit-frame-pointer -g -I tests/mock_include \
            main.c tests/mock_vita.c -o tests/vitaswitch_host
      - name: Run fault-injection tests
        run: python3 tests/test_switch.py
